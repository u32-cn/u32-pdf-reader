<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>u32 PDF 阅读器</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
    }
    #app { display: flex; flex-direction: column; height: 100%; }
    #toolbar {
      display: flex; gap: 8px; align-items: center;
      padding: 6px 12px; background: #fff; border-bottom: 1px solid #ddd;
    }
    #toolbar button {
      padding: 4px 10px; cursor: pointer; border: 1px solid #ccc;
      background: #fff; border-radius: 4px;
    }
    #toolbar button:hover { background: #eee; }
    #main { display: flex; flex: 1; min-height: 0; }
    #sidebar {
      width: 180px; overflow-y: auto; background: #eee;
      border-right: 1px solid #ddd; padding: 8px;
    }
    #sidebar canvas { width: 100%; margin-bottom: 8px; cursor: pointer; border: 1px solid #ccc; }
    #viewer-wrap { flex: 1; overflow-y: auto; position: relative; }
    #viewer { display: flex; flex-direction: column; align-items: center; padding: 16px 0; }
    .page-container {
      position: relative; margin-bottom: 16px;
      background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .page-container canvas { display: block; }
    .annotation-layer { position: absolute; inset: 0; }
    .audio-icon {
      position: absolute; width: 28px; height: 28px; border-radius: 50%;
      background: #1a73e8; color: #fff; display: flex; align-items: center;
      justify-content: center; cursor: pointer; font-size: 14px; user-select: none;
      border: none;
    }
    .audio-icon:hover { background: #1557b0; }
    /* 音频条 */
    [data-u32-name="audio-bar"] {
      display: flex; gap: 12px; align-items: center;
      padding: 8px 16px; background: #fff; border-top: 1px solid #ddd;
    }
    [data-u32-name="audio-bar"] button {
      width: 32px; height: 32px; border: none; border-radius: 50%;
      background: #1a73e8; color: #fff; cursor: pointer;
    }
    [data-u32-name="audio-bar-time"] { font-size: 12px; color: #555; white-space: nowrap; }
    /* 批注形状 */
    [data-u32-name="annotation-highlight"] { pointer-events: none; }
    [data-u32-name="annotation-underline"] { pointer-events: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar" data-u32-name="toolbar">
      <button id="btn-open" data-u32-name="toolbar-open">打开 PDF</button>
      <button id="btn-highlight" data-u32-name="toolbar-highlight" disabled>高亮</button>
      <button id="btn-underline" data-u32-name="toolbar-underline" disabled>下划线</button>
      <button id="btn-note" data-u32-name="toolbar-note" disabled>便签</button>
      <span id="file-name" data-u32-name="toolbar-filename" style="color:#666;font-size:13px;"></span>
    </div>
    <div id="main">
      <div id="sidebar" data-u32-name="sidebar"></div>
      <div id="viewer-wrap" data-u32-name="viewer-wrap">
        <div id="viewer" data-u32-name="viewer"></div>
      </div>
    </div>
    <!-- 音频条由 AudioBar 类注入 -->
  </div>
  <script type="module" src="./App.ts"></script>
</body>
</html>
